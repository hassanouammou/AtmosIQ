# AtmosIQ - Orchestration (Airflow) + Dashboard (Grafana) + PostgreSQL (zone Gold pour Grafana)
# Lancer : docker compose up -d   (depuis le dossier orchestration/)
# Mots de passe de DEV uniquement.

services:
  postgres:
    image: postgres:16
    container_name: atmos-postgres
    environment:
      POSTGRES_USER: atmos
      POSTGRES_PASSWORD: atmos
      POSTGRES_DB: meteo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmos -d meteo"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.3
    container_name: atmos-airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://atmos:atmos@postgres:5432/airflow
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname Atmos --role Admin --email admin@atmosiq.local || true;
      airflow scheduler & exec airflow webserver"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: atmos-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  pgdata:
  grafanadata:

# Reseau partage : les autres composes (Kafka, Spark, MinIO) pourront le rejoindre
networks:
  default:
    name: atmosiq-net